[package]
name = "noctiluca"
version = "0.1.0"
edition = "2024"
rust-version = "1.95"

[dependencies]
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "webp", "gif"] }
hex = "0.4"
fastnbt = "2.6"
flate2 = "1"
toml = { version = "1", default-features = false, features = ["parse", "serde", "std"] }
dunce = "1"
md-5 = "0.10"
base64 = "0.22"
anyhow = "1"
async-channel = "2"
chrono = "0.4"
rayon = "1"
regex = "1"
reqwest = { version = "0.13", features = ["blocking", "form", "json", "query", "system-proxy"] }
rust-embed = { version = "8", features = ["debug-embed"] }
keyring = { version = "3.6", features = ["windows-native"] }
open = "5"
url = "2"
zip = { version = "2.6", default-features = false, features = ["deflate"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.11"
sha1 = "0.11"
same-file = "1"
walkdir = "2"
tempfile = "3"
uuid = { version = "1", features = ["v4"] }
mc-launcher-core = "=0.1.2"
gpui = { package = "gpui-pre", version = "=0.3.8", default-features = false, features = ["stacker"] }
gpui_platform = { package = "gpui-pre-platform", version = "=0.3.8", features = ["font-kit"] }
ely-gpui-component = { git = "https://github.com/ZacharyZhang-NY/Ely-GPUI-Components", rev = "5d6efd46ec0c93b381ec7578561a1273c366025b" }

[target.'cfg(windows)'.dependencies]
windows = { version = "0.62.2", features = ["Win32_System_Com", "Win32_UI_Shell", "Win32_Storage_FileSystem"] }
windows-sys = { version = "0.61", features = ["Win32_UI_WindowsAndMessaging","Win32_UI_Shell","Win32_Foundation","Win32_System_SystemInformation", "Win32_Storage_FileSystem"] }

[build-dependencies]
embed-resource = "3.0"

[profile.dev]
debug = 0

# Embed DirectX shaders so the local Windows build can also run outside the Cargo checkout.
[profile.dev.package.gpui-pre-windows]
debug-assertions = false
